[package]
name = "spotify-probe"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
protobuf-codegen = "3.7"

[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = "=0.8.0"
librespot-protocol = "=0.8.0"
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rodio-backend"] }
librespot-connect = { version = "=0.8.0", path = "../../vendor/librespot-connect", default-features = false, features = ["native-tls"] }
protobuf-json-mapping = "3.7"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
protobuf = "3.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
strip = true
