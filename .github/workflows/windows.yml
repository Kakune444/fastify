name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Compile Windows desktop client
        run: npm run tauri build -- --ci --no-bundle
      - name: Verify native library pagination
        run: cargo test --release --locked --lib --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: spotisloth-windows-prototype
          path: src-tauri/target/release/spotisloth-desktop.exe
          retention-days: 7
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/spotify-probe
          cache-on-failure: true
      - name: Compile native Spotify probe (no credentials)
        run: cargo build --release --locked --manifest-path tools/spotify-probe/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-probe-windows
          path: tools/spotify-probe/target/release/spotify-probe.exe
          retention-days: 7
